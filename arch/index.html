<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FX-AlphaLab — Architecture</title>
  <link rel="stylesheet" href="styles/layout.css">
</head>
<body>

<div id="bar">
  <span class="bar-title">FX-AlphaLab</span>
  <div class="bar-div"></div>
  <span class="bar-sub">Multi-Agent Architecture</span>
  <div class="bar-div"></div>
  <span class="bar-tag">Interactive Map</span>
  <button id="theme-btn" title="Switch theme" aria-label="Toggle light/dark mode">
    <svg id="theme-icon-moon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
    <svg id="theme-icon-sun"  width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
  </button>
</div>

<div id="hint">Scroll to zoom · Drag to pan · Click nodes for details</div>

<svg id="svg-wrap" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arr-c" markerWidth="7" markerHeight="7" refX="5" refY="3" orient="auto">
      <path d="M.5.5L.5 5.5L7 3z" fill="#22d3ee" opacity=".7"/>
    </marker>
    <marker id="arr-p" markerWidth="7" markerHeight="7" refX="5" refY="3" orient="auto">
      <path d="M.5.5L.5 5.5L7 3z" fill="#a78bfa" opacity=".7"/>
    </marker>
    <marker id="arr-o" markerWidth="7" markerHeight="7" refX="5" refY="3" orient="auto">
      <path d="M.5.5L.5 5.5L7 3z" fill="#fb923c" opacity=".7"/>
    </marker>
    <marker id="arr-g" markerWidth="7" markerHeight="7" refX="5" refY="3" orient="auto">
      <path d="M.5.5L.5 5.5L7 3z" fill="#34d399" opacity=".7"/>
    </marker>
    <marker id="arr-a" markerWidth="7" markerHeight="7" refX="5" refY="3" orient="auto">
      <path d="M.5.5L.5 5.5L7 3z" fill="#fbbf24" opacity=".7"/>
    </marker>
    <marker id="arr-s" markerWidth="7" markerHeight="7" refX="5" refY="3" orient="auto">
      <path d="M.5.5L.5 5.5L7 3z" fill="#64748b" opacity=".7"/>
    </marker>
  </defs>
  <g id="world"></g>
</svg>

<div id="panel">
  <button id="pclose">×</button>
  <div id="pcontent"></div>
</div>

<div id="legend">
  <div class="leg-h">Agents</div>
  <div class="leg-i"><div class="leg-dot" style="background:#22d3ee"></div>Technical</div>
  <div class="leg-i"><div class="leg-dot" style="background:#a78bfa"></div>Macro</div>
  <div class="leg-i"><div class="leg-dot" style="background:#fb923c"></div>Sentiment</div>
  <div class="leg-i"><div class="leg-dot" style="background:#34d399"></div>Geopolitical</div>
  <div class="leg-i"><div class="leg-dot" style="background:#fbbf24"></div>Coordinator</div>
  <div style="margin-top:9px" class="leg-h">Types</div>
  <div class="leg-i"><div class="leg-dot" style="background:#64748b"></div>Source / Storage</div>
  <div class="leg-i">
    <div style="width:18px;height:1px;background:#475569;border-top:1px dashed #475569;margin-top:1px"></div>
    Context-only
  </div>
</div>

<div id="zctrl">
  <button class="zbtn" id="zoom-in">+</button>
  <button class="zbtn fit" id="zoom-fit">⊡</button>
  <button class="zbtn" id="zoom-out">−</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/dagre@0.8.5/dist/dagre.min.js"></script>
<script type="module" src="main.js"></script>
</body>
</html>
